
spring.application.name=gateway-service
spring.config.import=optional:classpath:models.yaml

# ── PostgreSQL ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/diplomatai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:diplomat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:diplomat_secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Redis ──
qc.service.url=${QC_SERVICE_URL:http://localhost:8000}

# ── JWT ──
jwt.secret=${JWT_SECRET:diplomatai_jwt_secret_key_change_in_production_min32chars}
jwt.expiration-ms=604800000

# ── Resilience4j ──
resilience4j.ratelimiter.instances.llmRateLimiter.limitForPeriod=5
resilience4j.ratelimiter.instances.llmRateLimiter.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.llmRateLimiter.timeoutDuration=5s

resilience4j.circuitbreaker.instances.llmCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.llmCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.llmCircuitBreaker.slidingWindowSize=10
