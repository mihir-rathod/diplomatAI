version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: diplomat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - diplomat-net

volumes:
  redis_data:

networks:
  diplomat-net:
    driver: bridge
